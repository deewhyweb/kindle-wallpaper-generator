[project]
name = "kindle-wallpaper"
version = "0.1.0"
description = "Turn your Kindle library into a bookcase background for video calls"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.14.0",
    "openai>=3.31.0",
    "pillow>=10.1",
    "playwright>=1.45",
]

[project.scripts]
kindle-wallpaper = "kindle_wallpaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
